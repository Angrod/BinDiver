[project]
name = "bindiver"
version = "0.1.0"
description = "Which versions of this MTG card are worth finding?"
requires-python = ">=3.12"
dependencies = ["certifi"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Only the Python package: setuptools would otherwise also find the Expo app's folder and refuse to install.
[tool.setuptools.packages.find]
include = ["bindiver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
